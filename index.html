<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Monthly Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-line:#000000;
    --ink:#0F1F3D;
    --ink-soft:#4A5568;
    --sage:#0F1F3D;
    --sage-bg:#E8EBF2;
    --brick:#B5482F;
    --brick-bg:#F7E6E1;
    --brass:#0F1F3D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0 0 2px;letter-spacing:-0.01em;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;font-family:'IBM Plex Mono',monospace;}
  .card{background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:16px 18px;margin-bottom:16px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--paper-line);border-radius:6px;padding:12px 10px;text-align:center;}
  .stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:4px;}
  .stat .num{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;}
  select,input{font-family:'Inter',sans-serif;font-size:14px;border:1px solid var(--paper-line);border-radius:4px;padding:8px 10px;background:#fff;color:var(--ink);}
  select:focus,input:focus{outline:none;border-color:var(--brass);}
  .month-select{font-family:'IBM Plex Mono',monospace;font-weight:500;}
  h2{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 12px;}
  .cat-row{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--paper-line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-name{font-size:14px;}
  .cat-row input{text-align:right;font-family:'IBM Plex Mono',monospace;padding:6px 8px;}
  .cat-row button{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px;}
  .cat-row button:hover{color:var(--brick);}
  .add-cat{display:flex;gap:8px;margin-top:10px;}
  .add-cat input{flex:1;}
  .btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:4px;border:1px solid var(--brass);background:var(--brass);color:#fff;cursor:pointer;white-space:nowrap;}
  .btn:hover{opacity:.9;}
  .btn.secondary{background:#fff;color:var(--brass);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .form-grid.full{grid-template-columns:1fr;}
  .expense-list{margin-top:4px;}
  .exp-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--paper-line);gap:10px;}
  .exp-row:last-child{border-bottom:none;}
  .exp-left{display:flex;flex-direction:column;min-width:0;}
  .exp-cat{font-size:13.5px;font-weight:500;}
  .exp-note{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .exp-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .exp-amt{font-family:'IBM Plex Mono',monospace;font-size:14px;}
  .exp-del{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;}
  .exp-del:hover{color:var(--brick);}
  .bar-track{height:6px;background:var(--paper-line);border-radius:3px;overflow:hidden;margin-top:6px;}
  .bar-fill{height:100%;border-radius:3px;background:var(--sage);}
  .bar-fill.over{background:var(--brick);}
  .cat-summary{padding:10px 0;border-bottom:1px dashed var(--paper-line);}
  .cat-summary:last-child{border-bottom:none;}
  .empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:14px 0;}
  .pill{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:2px 7px;border-radius:10px;}
  .pill.under{background:var(--sage-bg);color:var(--sage);}
  .pill.over{background:var(--brick-bg);color:var(--brick);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ledger</h1>
  <p class="sub" id="tagline">Loading your books…</p>

  <div class="row" style="margin-bottom:16px;">
    <select id="monthSelect" class="month-select"></select>
    <button class="btn secondary" id="prevBtn" style="padding:8px 12px;">‹</button>
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0;">Expected income</h2>
      <input type="number" id="incomeInput" placeholder="$0" style="width:110px;text-align:right;font-family:'IBM Plex Mono',monospace;">
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="label">Income</div><div class="num" id="statIncome">$0</div></div>
    <div class="stat"><div class="label">Budgeted</div><div class="num" id="statBudget">$0</div></div>
    <div class="stat"><div class="label">Unbudgeted</div><div class="num" id="statUnbudgeted">$0</div></div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="label">Spent</div><div class="num" id="statSpent">$0</div></div>
    <div class="stat"><div class="label">Remaining</div><div class="num" id="statRemain">$0</div></div>
    <div class="stat"><div class="label">Left to spend</div><div class="num" id="statLeftIncome">$0</div></div>
  </div>

  <div class="card">
    <h2>Categories &amp; budget</h2>
    <div id="catList"></div>
    <div class="add-cat">
      <input type="text" id="newCatName" placeholder="New category, e.g. Groceries">
      <input type="number" id="newCatAmt" placeholder="$" style="width:80px;">
      <button class="btn" id="addCatBtn">Add</button>
    </div>
  </div>

  <div class="card">
    <h2>This month by category</h2>
    <div id="catSummary"></div>
  </div>

  <div class="card">
    <h2>Log an expense</h2>
    <div class="form-grid">
      <select id="expCat"></select>
      <input type="number" id="expAmt" placeholder="Amount">
    </div>
    <div class="form-grid full">
      <input type="text" id="expNote" placeholder="Note (optional)">
    </div>
    <div id="expError" style="font-size:12px;color:var(--brick);margin-bottom:8px;display:none;"></div>
    <button class="btn" id="addExpBtn" style="width:100%;">Add expense</button>
  </div>

  <div class="card">
    <h2>Expenses this month</h2>
    <div class="expense-list" id="expList"></div>
  </div>
</div>

<script>
const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
let currentMonth = new Date().toISOString().slice(0,7);
let categories = {};
let expenses = [];
let income = 0;

function fmt(n){
  return '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
}
function monthLabel(ym){
  const [y,m] = ym.split('-');
  return monthNames[parseInt(m,10)-1] + ' ' + y;
}

const store = {
  hasClaudeStorage: typeof window.storage !== 'undefined' && !!window.storage,
  async get(key){
    if(this.hasClaudeStorage){
      try{ return await window.storage.get(key); }catch(e){ return null; }
    }
    const v = localStorage.getItem(key);
    return v === null ? null : { value: v };
  },
  async set(key, value){
    if(this.hasClaudeStorage){
      try{ return await window.storage.set(key, value); }catch(e){ return null; }
    }
    try{ localStorage.setItem(key, value); }catch(e){}
    return { value };
  }
};

async function loadCategories(){
  try{
    const res = await store.get('budget-categories');
    categories = res ? JSON.parse(res.value) : {};
  }catch(e){ categories = {}; }
  if(Object.keys(categories).length === 0){
    categories = {Groceries:400, Rent:1200, Transport:150, Dining:150, Fun:100};
    await saveCategories();
  }
}
async function saveCategories(){
  await store.set('budget-categories', JSON.stringify(categories));
}
async function loadIncome(){
  try{
    const res = await store.get('income:' + currentMonth);
    income = res ? parseFloat(res.value) || 0 : 0;
  }catch(e){ income = 0; }
}
async function saveIncome(){
  await store.set('income:' + currentMonth, String(income));
}
async function loadExpenses(){
  try{
    const res = await store.get('expenses:' + currentMonth);
    expenses = res ? JSON.parse(res.value) : [];
  }catch(e){ expenses = []; }
}
async function saveExpenses(){
  await store.set('expenses:' + currentMonth, JSON.stringify(expenses));
}

function renderMonthSelect(){
  const sel = document.getElementById('monthSelect');
  const opts = new Set();
  opts.add(currentMonth);
  const now = new Date();
  for(let i=0;i<12;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    opts.add(d.toISOString().slice(0,7));
  }
  const sorted = Array.from(opts).sort().reverse();
  sel.innerHTML = sorted.map(ym => `<option value="${ym}" ${ym===currentMonth?'selected':''}>${monthLabel(ym)}</option>`).join('');
}

function renderCatList(){
  const list = document.getElementById('catList');
  const names = Object.keys(categories);
  if(names.length===0){ list.innerHTML = '<div class="empty">No categories yet — add one below.</div>'; return; }
  list.innerHTML = names.map(name => `
    <div class="cat-row">
      <div class="cat-name">${escapeHtml(name)}</div>
      <input type="number" data-cat="${escapeHtml(name)}" class="cat-amt-input" value="${categories[name]}">
      <button data-cat="${escapeHtml(name)}" class="del-cat-btn" aria-label="Remove ${escapeHtml(name)}">×</button>
    </div>
  `).join('');
  list.querySelectorAll('.cat-amt-input').forEach(inp => {
    inp.addEventListener('input', async (e) => {
      const cat = e.target.getAttribute('data-cat');
      const val = parseFloat(e.target.value) || 0;
      categories[cat] = val;
      renderStats();
      renderCatSummary();
      await saveCategories();
    });
  });
  list.querySelectorAll('.del-cat-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const cat = e.target.getAttribute('data-cat');
      delete categories[cat];
      await saveCategories();
      renderAll();
    });
  });
}

function renderExpCatOptions(){
  const sel = document.getElementById('expCat');
  const names = Object.keys(categories);
  sel.innerHTML = names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('') || '<option value="">Add a category first</option>';
}

function renderStats(){
  const totalBudget = Object.values(categories).reduce((a,b)=>a+b,0);
  const totalSpent = expenses.reduce((a,e)=>a+e.amount,0);
  const remain = totalBudget - totalSpent;
  const unbudgeted = income - totalBudget;
  const leftIncome = income - totalSpent;

  document.getElementById('statIncome').textContent = fmt(income);
  document.getElementById('statBudget').textContent = fmt(totalBudget);
  document.getElementById('statSpent').textContent = fmt(totalSpent);

  const unbudgetedEl = document.getElementById('statUnbudgeted');
  unbudgetedEl.textContent = fmt(unbudgeted);
  unbudgetedEl.style.color = unbudgeted < 0 ? 'var(--brick)' : 'var(--ink)';

  const remainEl = document.getElementById('statRemain');
  remainEl.textContent = fmt(remain);
  remainEl.style.color = remain < 0 ? 'var(--brick)' : 'var(--sage)';

  const leftIncomeEl = document.getElementById('statLeftIncome');
  leftIncomeEl.textContent = fmt(leftIncome);
  leftIncomeEl.style.color = leftIncome < 0 ? 'var(--brick)' : 'var(--sage)';
}

function renderCatSummary(){
  const box = document.getElementById('catSummary');
  const names = Object.keys(categories);
  if(names.length===0){ box.innerHTML = '<div class="empty">Nothing to show yet.</div>'; return; }
  box.innerHTML = names.map(name => {
    const budget = categories[name];
    const spent = expenses.filter(e=>e.category===name).reduce((a,e)=>a+e.amount,0);
    const pct = budget > 0 ? Math.min(100, (spent/budget)*100) : (spent>0?100:0);
    const over = spent > budget;
    return `
      <div class="cat-summary">
        <div class="row">
          <span class="cat-name">${escapeHtml(name)}</span>
          <span class="pill ${over?'over':'under'}">${fmt(spent)} / ${fmt(budget)}</span>
        </div>
        <div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%;"></div></div>
      </div>
    `;
  }).join('');
}

function renderExpenseList(){
  const box = document.getElementById('expList');
  if(expenses.length===0){ box.innerHTML = '<div class="empty">No expenses logged for this month.</div>'; return; }
  const sorted = [...expenses].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  box.innerHTML = sorted.map(e => `
    <div class="exp-row">
      <div class="exp-left">
        <span class="exp-cat">${escapeHtml(e.category)}</span>
        ${e.note ? `<span class="exp-note">${escapeHtml(e.note)}</span>` : ''}
      </div>
      <div class="exp-right">
        <span class="exp-amt">${fmt(e.amount)}</span>
        <button class="exp-del" data-id="${e.id}" aria-label="Delete expense">×</button>
      </div>
    </div>
  `).join('');
  box.querySelectorAll('.exp-del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.getAttribute('data-id');
      expenses = expenses.filter(x => x.id !== id);
      await saveExpenses();
      renderAll();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAll(){
  document.getElementById('tagline').textContent = monthLabel(currentMonth) + ' · kept right here, on this device';
  document.getElementById('incomeInput').value = income || '';
  renderMonthSelect();
  renderCatList();
  renderExpCatOptions();
  renderStats();
  renderCatSummary();
  renderExpenseList();
}

async function switchMonth(ym){
  currentMonth = ym;
  await loadIncome();
  await loadExpenses();
  renderAll();
}

document.getElementById('incomeInput').addEventListener('input', async (e) => {
  income = parseFloat(e.target.value) || 0;
  renderStats();
  await saveIncome();
});

document.getElementById('monthSelect').addEventListener('change', (e) => switchMonth(e.target.value));
document.getElementById('prevBtn').addEventListener('click', () => {
  const [y,m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  switchMonth(d.toISOString().slice(0,7));
});

document.getElementById('addCatBtn').addEventListener('click', async () => {
  const nameInput = document.getElementById('newCatName');
  const amtInput = document.getElementById('newCatAmt');
  const name = nameInput.value.trim();
  const amt = parseFloat(amtInput.value) || 0;
  if(!name) return;
  categories[name] = amt;
  await saveCategories();
  nameInput.value = '';
  amtInput.value = '';
  renderAll();
});

document.getElementById('addExpBtn').addEventListener('click', async () => {
  const cat = document.getElementById('expCat').value;
  const amtInput = document.getElementById('expAmt');
  const noteInput = document.getElementById('expNote');
  const errEl = document.getElementById('expError');
  const amt = parseFloat(amtInput.value);
  errEl.style.display = 'none';
  if(!cat){ errEl.textContent = 'Add a category first.'; errEl.style.display='block'; return; }
  if(!amtInput.value || isNaN(amt) || amt <= 0){ errEl.textContent = 'Enter an amount greater than 0.'; errEl.style.display='block'; return; }
  expenses.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    category: cat,
    amount: amt,
    note: noteInput.value.trim(),
    date: new Date().toISOString().slice(0,10)
  });
  await saveExpenses();
  amtInput.value = '';
  noteInput.value = '';
  renderAll();
});

(async function init(){
  await loadCategories();
  await loadIncome();
  await loadExpenses();
  renderAll();
})();
</script>
</body>
</html>
